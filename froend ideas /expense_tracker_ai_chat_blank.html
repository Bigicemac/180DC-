<div style="display:flex; gap:0; min-height:600px; font-family:var(--font-sans);">
  <div style="width:190px; flex-shrink:0; border-right:0.5px solid var(--border); padding:1.25rem 1rem; display:flex; flex-direction:column; gap:4px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:1.5rem;">
      <div style="width:28px; height:28px; border-radius:8px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-wallet" style="font-size:16px; color:var(--text-accent);" aria-hidden="true"></i></div>
      <span style="font-weight:500; font-size:15px;">Finly</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius); color:var(--text-secondary);"><i class="ti ti-layout-dashboard" style="font-size:16px;" aria-hidden="true"></i><span style="font-size:13px;">Dashboard</span></div>
    <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius); background:var(--fill-ghost-selected, var(--surface-1));"><i class="ti ti-message-circle" style="font-size:16px;" aria-hidden="true"></i><span style="font-size:13px; font-weight:500;">AI assistant</span></div>
    <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius); color:var(--text-secondary);"><i class="ti ti-settings" style="font-size:16px;" aria-hidden="true"></i><span style="font-size:13px;">Settings</span></div>
    <div style="margin-top:auto; display:flex; align-items:center; gap:8px; padding-top:1rem; border-top:0.5px solid var(--border);">
      <div style="width:26px; height:26px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; color:var(--text-accent);">RS</div>
      <span style="font-size:12px; color:var(--text-secondary);">Riya S.</span>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <div style="padding:1rem 1.5rem; border-bottom:0.5px solid var(--border); display:flex; align-items:center; gap:8px;">
      <div style="width:26px; height:26px; border-radius:8px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-sparkles" style="font-size:14px; color:var(--text-accent);" aria-hidden="true"></i></div>
      <p style="font-size:14px; font-weight:500; margin:0;">Finance assistant</p>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:2rem;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;"><i class="ti ti-sparkles" style="font-size:22px; color:var(--text-accent);" aria-hidden="true"></i></div>
      <p style="font-size:15px; font-weight:500; margin:0;">Ask about your money, or log an expense</p>
      <p style="font-size:13px; color:var(--text-secondary); margin:-6px 0 0; text-align:center; max-width:320px;">Try "spent 300 on groceries" or "how much did I spend on dining this month"</p>
    </div>

    <div style="padding:1rem 1.5rem; border-top:0.5px solid var(--border);">
      <div style="display:flex; align-items:center; gap:8px; background:var(--fill-field); border:0.5px solid var(--fill-field-ring); border-radius:var(--radius); padding:6px 6px 6px 14px;">
        <input type="text" placeholder="Ask about your spending, or log an expense" style="flex:1; border:none; background:transparent; font-size:13px; outline:none;" />
        <button style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0;"><i class="ti ti-arrow-up" style="font-size:16px;" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
